# The update server: static APKs and manifests, plain HTTP, LAN only.
#
# Its own port rather than a folder under the default site, because that site
# rewrites every request to HTTPS and its certificate is the snakeoil one, which
# Android rejects. Nothing here is dynamic — publishing is copying a file.
#
# Install:
#   sudo cp updates.conf /etc/apache2/sites-available/updates.conf
#   sudo a2enmod headers          # Header below needs it; apache will not start without
#   sudo a2ensite updates
#   sudo systemctl reload apache2

Listen 8081

<VirtualHost *:8081>
    ServerName updates.lan
    DocumentRoot /var/www/updates

    <Directory /var/www/updates>
        # Indexes so the folder can be read in a browser while publishing is
        # still done by hand.
        Options +Indexes +FollowSymLinks
        AllowOverride None
        Require ip 127.0.0.1
        # The whole private range, not one subnet: the phone lands on whichever
        # 192.168.x the router hands out.
        Require ip 192.168.0.0/16
    </Directory>

    # A manifest is rewritten in place on every publish, so a cached copy is
    # exactly the answer that must not be served. The client already asks for a
    # fresh one; this makes the server say the same thing.
    <FilesMatch "^latest\.json$">
        Header set Cache-Control "no-store"
    </FilesMatch>

    AddType application/vnd.android.package-archive .apk
    AddType application/json .json

    ErrorLog ${APACHE_LOG_DIR}/updates-error.log
    CustomLog ${APACHE_LOG_DIR}/updates-access.log combined
</VirtualHost>
